# Defaults are configured in /etc/sysctl.d/* and can be customized in this file

# =====================================================================
# 1. 基础文件系统限制 (专为 4G 物理内存优化)
# =====================================================================
fs.file-max = 524288
fs.nr_open = 524288

# =====================================================================
# 2. 路由与连接跟踪 (彻底杜绝大流量 P2P 下载导致的断网陷阱)
# =====================================================================
net.netfilter.nf_conntrack_max = 524288
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 16384

# =====================================================================
# 3. 局域网网关安全与基本网络
# =====================================================================
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv6.conf.all.disable_ipv6 = 0
net.ipv6.conf.default.disable_ipv6 = 0
net.ipv6.conf.lo.disable_ipv6 = 0

# =====================================================================
# 4. 邻居表限制 (防范局域网/多VLAN下设备过多导致表溢出报错)
# =====================================================================
net.ipv4.neigh.default.gc_thresh1 = 512
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096

# =====================================================================
# 5. TCP 高并发性能优化 (高效回收僵尸连接)
# =====================================================================
net.ipv4.tcp_max_tw_buckets = 65535
net.ipv4.tcp_fin_timeout = 20
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_slow_start_after_idle = 0

# 开启 TCP Fast Open 降低 SFTPGo 频繁建立连接的握手延迟
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_congestion_control = bbr

# TCP 保活优化，及早释放断开的客户端连接
net.ipv4.tcp_keepalive_time = 1200
net.ipv4.tcp_keepalive_intvl = 20
net.ipv4.tcp_keepalive_probes = 3

# =====================================================================
# 6. 4G 内存专属高速网络缓冲区 (榨干千兆/万兆内网线速吞吐)
# =====================================================================
net.ipv4.tcp_rmem = 4096 87380 6291456
net.ipv4.tcp_wmem = 4096 65536 4194304
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 6291456
net.core.wmem_max = 4194304

# =====================================================================
# 7. 内存调度策略优化 (极致物理内存优先，保留 10% 倾向给 Swap 兜底)
# =====================================================================
vm.swappiness = 10
vm.overcommit_memory = 0
